<div class="max-w-3xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
  <div class="bg-white shadow rounded-lg overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200 bg-indigo-50 flex items-center justify-between">
        <h2 class="text-2xl font-bold text-gray-800">Host Profile</h2>
        <span class="inline-flex items-center px-3 py-0.5 rounded-full text-sm font-medium bg-indigo-100 text-indigo-800">Host</span>
    </div>

    <div *ngIf="isLoading" class="p-6 text-center text-gray-500">
        Loading host info...
    </div>

    <div *ngIf="!isLoading && host" class="p-6 space-y-6">
        <div class="flex items-center space-x-4">
            <div class="h-16 w-16 rounded-full bg-gray-200 flex items-center justify-center text-2xl text-gray-500">
                <i class="fa-solid fa-user-tie"></i>
            </div>
            <div>
                <h3 class="text-xl font-medium text-gray-900">{{ host.agencyName || "Agency Name Not Provided" }}</h3>
            </div>
        </div>
        
        <div class="border-t border-gray-100 pt-4">
            <h4 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-2">About the Agency</h4>
            <p class="text-gray-700 leading-relaxed">{{ host.bio || "No biography provided." }}</p>
        </div>
    </div>
  </div>
</div>
