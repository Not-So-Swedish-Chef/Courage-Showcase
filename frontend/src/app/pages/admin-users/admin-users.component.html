<div class="admin-layout">
  <!-- Sidebar -->
  <nav class="admin-sidebar">
    <h3 class="sidebar-title">Admin Menu</h3>

    <a routerLink="/admin/events" routerLinkActive="active-link">
      Manage Events
    </a>

    <a routerLink="/admin/users" routerLinkActive="active-link">
      Manage Users
    </a>
  </nav>

  <!-- Main Content -->
  <div class="admin-content">
    <h2 class="page-title">Manage Users</h2>

    <div *ngIf="loading" class="loading">Loading users...</div>

    <div class="admin-card" *ngIf="!loading">
      <table *ngIf="users.length > 0" class="admin-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>User Type</th>
            <th>Status</th>
            <th>Details</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let user of users"
            [class]="getUserStatusClass(user)"
          >
            <td>{{ user.firstName }} {{ user.lastName }}</td>
            <td>{{ user.email }}</td>

            <td>{{ getUserTypeLabel(user.userType) }}</td>

            <td>
              <span [class]="'status-badge ' + getUserStatusClass(user)">
                {{ getUserStatusText(user) }}
              </span>
            </td>

            <td class="status-details">
              {{ getStatusDetails(user) }}
            </td>

            <td>
              <div class="actions">
                <button 
                  class="suspend-btn" 
                  (click)="openSuspend(user)"
                  *ngIf="canSuspend(user)">
                  Suspend
                </button>

                <button 
                  class="ban-btn" 
                  (click)="banUser(user.id)"
                  *ngIf="canBan(user)">
                  Ban
                </button>

                <button 
                  class="unsuspend-btn" 
                  (click)="unsuspendUser(user.id)"
                  *ngIf="canUnsuspend(user)">
                  Unsuspend
                </button>

                <button 
                  class="unban-btn" 
                  (click)="unbanUser(user.id)"
                  *ngIf="canUnban(user)">
                  Unban
                </button>
              </div>

              <div *ngIf="suspendTarget === user" class="suspend-panel">
                <label>Suspend for (days):</label>
                <input type="number" [(ngModel)]="suspendDays" min="1" max="365" />

                <button class="confirm-btn" (click)="confirmSuspend()">
                  Confirm
                </button>
                <button class="cancel-btn" (click)="cancelSuspend()">
                  Cancel
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <p *ngIf="users.length === 0" class="no-data">No users found.</p>
    </div>
  </div>
</div>
