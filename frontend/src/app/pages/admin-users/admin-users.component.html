<div class="admin-layout">
  <!-- Sidebar -->
  <nav class="admin-sidebar">
    <h3 class="sidebar-title">Admin Menu</h3>

    <a routerLink="/admin/events" routerLinkActive="active-link">
      Manage Events
    </a>

    <a routerLink="/admin/users" routerLinkActive="active-link">
      Manage Users
    </a>
  </nav>

  <!-- Main Content -->
  <div class="admin-content">
    <h2 class="page-title">Manage Users</h2>

    <div *ngIf="loading" class="loading">Loading users...</div>

    <div class="admin-card" *ngIf="!loading">
      <table *ngIf="users.length > 0" class="admin-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>User Type</th>
            <th>Suspend Status</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let user of users"
            [class.suspended-row]="isSuspended(user)"
          >
            <td>{{ user.firstName }} {{ user.lastName }}</td>
            <td>{{ user.email }}</td>

            <td>{{ getUserTypeLabel(user.userType) }}</td>

            <td>
              <span *ngIf="isSuspended(user)" class="suspended-badge">
                Suspended until {{ user.suspendUntil | date : "shortDate" }}
              </span>
              <span *ngIf="!isSuspended(user)">Active</span>
            </td>

            <td>
              <div class="actions">
                <button class="suspend-btn" (click)="openSuspend(user)">
                  Suspend
                </button>

                <button class="delete-btn" (click)="deleteUser(user.id)">
                  Delete
                </button>
              </div>

              <!-- Inline suspend UI -->
              <div *ngIf="suspendTarget === user" class="suspend-panel">
                <label>Suspend Until:</label>
                <input type="date" [(ngModel)]="suspendUntil" />

                <button class="confirm-btn" (click)="confirmSuspend()">
                  Confirm
                </button>
                <button class="cancel-btn" (click)="cancelSuspend()">
                  Cancel
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <p *ngIf="users.length === 0" class="no-data">No users found.</p>
    </div>
  </div>
</div>
