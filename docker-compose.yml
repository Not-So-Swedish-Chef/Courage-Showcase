services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: courage_showcase_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -No -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - courage-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: courage_showcase_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=database,1433;Database=CCCDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true
      - Jwt__Issuer=courage-showcase
      - Jwt__Audience=courage-showcase
      - Jwt__Secret=my_super_long_and_secure_secret_key_12345678
      - Jwt__TokenValidityMins=30
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5000:8080"  # host:container
    networks:
      - courage-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: courage_showcase_frontend
    environment:
      - API_URL=http://backend:8080
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - courage-network

volumes:
  mssql-data:

networks:
  courage-network:
    driver: bridge

